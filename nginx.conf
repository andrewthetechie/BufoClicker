# Serve the built site under /BufoClicker/ (the GitHub Pages project path),
# with a root redirect for convenience. Mirrors the production host.
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /BufoClicker/;
    }

    location = /BufoClicker/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    location /BufoClicker/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /BufoClicker/index.html;
    }
}
